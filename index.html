  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a1a 100%);
      min-height: 100vh;
    }
    @keyframes twinkle { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.8; } }
    @keyframes card-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    @keyframes mystery-glow { 0%, 100% { box-shadow: 0 0 40px rgba(255,111,0,0.3), inset 0 0 30px rgba(255,255,255,0.1); } 50% { box-shadow: 0 0 60px rgba(255,111,0,0.6), inset 0 0 40px rgba(255,255,255,0.2); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalPop { from { transform: scale(0.8) translateY(50px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes particle-fly { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { opacity: 0; } }
    ::-webkit-scrollbar { height: 6px; }
    ::-webkit-scrollbar-track { background: #111; border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>

    const FUN_FACTS = [

    const getMessageForDate = (totalDays) => {
      const now = new Date();
      if (totalDays <= 0) {
        const hour = now.getHours();
        return WAITING_MESSAGES.hours[Math.min(hour, 12)];
      } else if (totalDays <= 30) {
        return WAITING_MESSAGES.days[Math.min(30 - totalDays, 29)];
      } else {
        return WAITING_MESSAGES.months[now.getMonth()];
      }
    };

    const getSimulatedYear = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const testYear = urlParams.get('year');
      return testYear ? parseInt(testYear) : new Date().getFullYear();
    };

    const getFactForDate = () => {
      const now = new Date();
      const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
      return FUN_FACTS[dayOfYear % FUN_FACTS.length];
    };

              borderRadius: '20px',

                : 'linear-gradient(145deg, #1a1a2e 0%, #16213e 100%)',
              border: `3px solid ${showMystery ? '#4a4a6a' : rarityConfig.glow}`,
              overflow: 'hidden',

                position: 'absolute', top: '15px', right: '15px',
                padding: '6px 14px', borderRadius: '20px',

                fontSize: '11px', fontWeight: '700', textTransform: 'uppercase',
                letterSpacing: '1px', color: '#fff',
                boxShadow: showMystery ? 'none' : `0 0 20px ${rarityConfig.glow}60`

              {/* Рік */}

                position: 'absolute', top: '15px', left: '15px',
                fontSize: '24px', fontWeight: '900',

    // Головний компонент
    function App() {
      const [timeLeft, setTimeLeft] = useState({});
      const [canUnlock, setCanUnlock] = useState(false);
      const [currentMessage, setCurrentMessage] = useState('');
      const [currentFact, setCurrentFact] = useState('');
      const [revealingCard, setRevealingCard] = useState(null);
      const [revealedCards, setRevealedCards] = useState(() => {
        // Завантажуємо збережені відкриті картки з localStorage
        const saved = localStorage.getItem('powerbank-revealed');
        return saved ? JSON.parse(saved) : {};
      });
      const [showModal, setShowModal] = useState(false);
      const [selectedCard, setSelectedCard] = useState(null);
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        // Перевіряємо чи вже авторизований
        return localStorage.getItem('powerbank-auth') === 'true';
      });
      const [showPinModal, setShowPinModal] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);

      // Секретний PIN - зміни на свій!
      const SECRET_PIN = '0701'; // Дата народження як PIN

      // Зберігаємо відкриті картки
      useEffect(() => {
        localStorage.setItem('powerbank-revealed', JSON.stringify(revealedCards));
      }, [revealedCards]);

      const handlePinSubmit = () => {
        if (pinInput === SECRET_PIN) {
          localStorage.setItem('powerbank-auth', 'true');
          // Перезавантажуємо сторінку щоб оновити стан
          window.location.reload();
        } else {
          setPinError(true);
          setPinInput('');
        }
      };

      const calculateTimeLeft = useCallback(() => {
        const now = new Date();
        const currentYear = now.getFullYear();
        
        let birthdayDate = new Date(currentYear, BIRTHDAY_MONTH - 1, BIRTHDAY_DAY, UNLOCK_HOUR, 0, 0);
        if (now > birthdayDate) {
          birthdayDate = new Date(currentYear + 1, BIRTHDAY_MONTH - 1, BIRTHDAY_DAY, UNLOCK_HOUR, 0, 0);
        }
        
        const diff = birthdayDate - now;
        const isBirthdayToday = now.getMonth() === (BIRTHDAY_MONTH - 1) && now.getDate() === BIRTHDAY_DAY;
        const isAfterNoon = now.getHours() >= UNLOCK_HOUR;
        
        // Тестовий режим: додай ?test=true до URL щоб відкрити подарунок
        // Симуляція року: додай ?year=2027 щоб побачити як буде виглядати в 2027
        const urlParams = new URLSearchParams(window.location.search);
        const isTestMode = urlParams.get('test') === 'true';
        const testYear = urlParams.get('year');
        
        const canUnlockTime = (isBirthdayToday && isAfterNoon) || isTestMode;
        setCanUnlock(canUnlockTime && isAuthenticated);
        
        if (diff <= 0) return { months: 0, weeks: 0, days: 0, hours: 0, minutes: 0, seconds: 0, totalDays: 0 };
        
        const seconds = Math.floor((diff / 1000) % 60);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const totalDays = Math.floor(diff / (1000 * 60 * 60 * 24));
        const weeks = Math.floor(totalDays / 7);
        const days = totalDays % 7;
        const months = Math.floor(totalDays / 30);
        
        return { months, weeks, days, hours, minutes, seconds, totalDays };
      }, []);

      useEffect(() => {
        const timer = setInterval(() => {
          const time = calculateTimeLeft();
          setTimeLeft(time);
          setCurrentMessage(getMessageForDate(time.totalDays));
          setCurrentFact(getFactForDate());
        }, 1000);
        return () => clearInterval(timer);
      }, [calculateTimeLeft, isAuthenticated]);

      const handleCardClick = (index, powerbank) => {
        if (powerbank.unlocked || revealedCards[index]) {
          setSelectedCard({ ...powerbank, index });
          setShowModal(true);
          return;
        }
        if (!canUnlock) return;
        
        setRevealingCard(index);
        setTimeout(() => {
          setRevealedCards(prev => ({ ...prev, [index]: true }));
          setRevealingCard(null);
          setSelectedCard({ ...powerbank, index });
          setShowModal(true);
        }, 2000);
      };

      return (
        <div style={{
          minHeight: '100vh',
          background: 'linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a1a 100%)',
          color: '#fff', overflow: 'hidden', position: 'relative'
        }}>
          {/* Зірки */}
          <div style={{
            position: 'fixed', inset: 0,
            background: `radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                         radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                         radial-gradient(1px 1px at 90px 40px, #fff, transparent)`,
            backgroundSize: '200px 200px',
            animation: 'twinkle 4s ease-in-out infinite',
            opacity: 0.5, pointerEvents: 'none'
          }} />

          {/* Заголовок */}
          <header style={{ textAlign: 'center', padding: '60px 20px 40px' }}>
            <div style={{
              fontSize: '14px', textTransform: 'uppercase',
              letterSpacing: '6px', color: '#888', marginBottom: '15px'
            }}>Ексклюзивна колекція</div>
            <h1 style={{
              fontSize: 'clamp(2.5rem, 8vw, 4.5rem)', fontWeight: '900', margin: 0,
              background: 'linear-gradient(135deg, #FFD700 0%, #FF6F00 50%, #7C4DFF 100%)',
              WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent',
              letterSpacing: '-2px'
            }}>Power Collection</h1>
            <p style={{ fontSize: '18px', color: '#aaa', marginTop: '15px' }}>
            </p>
          </header>

                    {/* Таймер */}
          {!canUnlock && (
            <div style={{
              maxWidth: '800px', margin: '0 auto 50px', padding: '30px',
              background: 'linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02))',
              borderRadius: '30px', border: '1px solid rgba(255,255,255,0.1)'
            }}>
              <div style={{ textAlign: 'center', marginBottom: '25px' }}>
                <div style={{ fontSize: '16px', color: '#FF6F00', fontWeight: '600', marginBottom: '5px' }}>
                  ⏳ До наступного подарунка
                </div>
                <div style={{ fontSize: '14px', color: '#888' }}>7 січня о 12:00</div>
              </div>

              <div style={{
                display: 'flex', justifyContent: 'center', gap: '15px',
                flexWrap: 'wrap', marginBottom: '30px'
              }}>
                {[
                  { value: timeLeft.months || 0, label: 'міс' },
                  { value: timeLeft.weeks || 0, label: 'тиж' },
                  { value: timeLeft.days || 0, label: 'дн' },
                  { value: timeLeft.hours || 0, label: 'год' },
                  { value: timeLeft.minutes || 0, label: 'хв' },
                  { value: timeLeft.seconds || 0, label: 'сек' }
                ].map((item, i) => (
                  <div key={i} style={{
                    background: 'linear-gradient(145deg, #1a1a3a, #0a0a1a)',
                    borderRadius: '15px', padding: '15px 20px', minWidth: '70px',
                    textAlign: 'center', border: '1px solid rgba(255,111,0,0.2)',
                    boxShadow: '0 10px 30px rgba(0,0,0,0.3)'
                  }}>
                    <div style={{ fontSize: '32px', fontWeight: '800', color: '#fff', fontFamily: 'monospace' }}>
                      {String(item.value).padStart(2, '0')}
                    </div>
                    <div style={{ fontSize: '11px', color: '#888', textTransform: 'uppercase', letterSpacing: '1px' }}>
                      {item.label}
                    </div>
                  </div>
                ))}
              </div>

              <div style={{
                textAlign: 'center', padding: '20px',
                background: 'rgba(255,111,0,0.1)', borderRadius: '15px',
                border: '1px solid rgba(255,111,0,0.2)'
              }}>
                <div style={{ fontSize: '18px', color: '#fff', marginBottom: '10px', fontWeight: '600' }}>
                  {currentMessage}
                </div>
                <div style={{ fontSize: '14px', color: '#aaa', fontStyle: 'italic' }}>
                  💡 {currentFact}
                </div>
              </div>
            </div>
          )}

          {/* День народження - показуємо коли час прийшов */}
          {(() => {
            const now = new Date();
            const urlParams = new URLSearchParams(window.location.search);
            const isTestMode = urlParams.get('test') === 'true';
            const isBirthdayToday = now.getMonth() === (BIRTHDAY_MONTH - 1) && now.getDate() === BIRTHDAY_DAY;
            const isAfterNoon = now.getHours() >= UNLOCK_HOUR;
            const isBirthdayTime = (isBirthdayToday && isAfterNoon) || isTestMode;
            
            if (!isBirthdayTime) return null;
            
            return (
              <div style={{ textAlign: 'center', margin: '0 auto 50px', padding: '30px', maxWidth: '600px' }}>
                <div style={{ fontSize: '60px', marginBottom: '20px', animation: 'bounce 1s ease-in-out infinite' }}>
                  🎉🎂🎁
                </div>
                <h2 style={{
                  fontSize: '32px', fontWeight: '800',
                  background: 'linear-gradient(135deg, #FFD700, #FF6F00)',
                  WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent',
                  marginBottom: '15px'
                }}>З Днем Народження!</h2>
                {isAuthenticated ? (
                  <p style={{ fontSize: '18px', color: '#aaa' }}>
                    Твій новий павербанк чекає! Натисни на картку, щоб відкрити 🎁
                  </p>
                ) : (
                  <>
                    <p style={{ fontSize: '18px', color: '#aaa', marginBottom: '20px' }}>
                      Введи секретний код, щоб відкрити подарунок 🔐
                    </p>
                    <button
                      onClick={() => setShowPinModal(true)}
                      style={{
                        padding: '15px 40px', borderRadius: '15px', border: 'none',
                        background: 'linear-gradient(135deg, #FFD700, #FF6F00)',
                        color: '#fff', fontSize: '18px', fontWeight: '700', cursor: 'pointer',
                        boxShadow: '0 10px 30px rgba(255,111,0,0.4)'
                      }}
                    >
                      🔓 Ввести код
                    </button>
                  </>
                )}
              </div>
            );
          })()}

          {/* Картки */}
          {(() => {
            const simulatedYear = getSimulatedYear();
            const futureToCurrent = FUTURE_POWERBANKS
              .filter(pb => pb.year <= simulatedYear)
              .map(pb => ({
                year: pb.year,
                name: pb.name,
                rarity: pb.rarity,
                description: pb.teaser,
                funFact: "Цікавий факт з'явиться пізніше!",
                image: `./images/powerbank-${pb.year}.png`,
                unlocked: false
              }));
            const allCards = [...POWERBANKS, ...futureToCurrent];
            
            return (
              <>
                <CollectionStats powerbanks={allCards} revealedCards={revealedCards} />
                <div style={{
                  display: 'flex', justifyContent: 'center', gap: '40px',
                  flexWrap: 'wrap', padding: '20px 40px 60px', maxWidth: '1400px', margin: '0 auto'
                }}>
                  {allCards.map((powerbank, index) => (
                    <PowerbankCard
                      key={powerbank.year}
                      powerbank={{ ...powerbank, unlocked: powerbank.unlocked || revealedCards[index] }}
                      onClick={() => handleCardClick(index, powerbank)}
                      isRevealing={revealingCard === index}
                      canUnlock={canUnlock && !powerbank.unlocked && !revealedCards[index]}
                    />
                  ))}
                </div>
              </>
            );
          })()}

          {/* Майбутні */}
          <div style={{ padding: '40px 20px 80px', maxWidth: '1200px', margin: '0 auto' }}>
            <div style={{ textAlign: 'center', marginBottom: '30px' }}>
              <div style={{ 
                fontSize: '14px', textTransform: 'uppercase', 
                letterSpacing: '6px', color: '#444'
              }}>
                Coming Soon
              </div>
            </div>
            <div style={{
              display: 'flex', justifyContent: 'flex-start', gap: '20px',
              overflowX: 'auto', padding: '10px'
            }}>
              {FUTURE_POWERBANKS.filter(pb => pb.year > getSimulatedYear()).map((pb) => <FutureCard key={pb.year} powerbank={pb} />)}
            </div>
          </div>

          {/* Модалка */}
          {showModal && selectedCard && (
            <div onClick={() => setShowModal(false)} style={{
              position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.95)',
              display: 'flex', alignItems: 'flex-start', justifyContent: 'center',
              zIndex: 1000, animation: 'fadeIn 0.3s ease', 
              padding: '10px', overflowY: 'auto'
            }}>
              <div onClick={e => e.stopPropagation()} style={{
                background: 'linear-gradient(145deg, #1a1a3a, #0a0a1a)',
                borderRadius: '20px', padding: '25px 20px', maxWidth: '400px', width: '100%',
                border: `2px solid ${RARITY_CONFIG[selectedCard.rarity].glow}`,
                boxShadow: `0 0 40px ${RARITY_CONFIG[selectedCard.rarity].glow}40`,
                animation: 'modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                margin: '20px auto'
              }}>
                <div style={{ textAlign: 'center', marginBottom: '20px' }}>
                  <div style={{
                    display: 'inline-block', padding: '6px 16px', borderRadius: '20px',
                    background: RARITY_CONFIG[selectedCard.rarity].gradient,
                    fontSize: '11px', fontWeight: '700', textTransform: 'uppercase',
                    letterSpacing: '2px', marginBottom: '15px'
                  }}>{RARITY_CONFIG[selectedCard.rarity].label}</div>
                  
                  <div style={{
                    marginBottom: '15px',
                    filter: `drop-shadow(0 0 30px ${RARITY_CONFIG[selectedCard.rarity].glow})`
                  }}>
                    {selectedCard.image ? (
                      <img src={selectedCard.image} alt={selectedCard.name}
                        style={{ maxWidth: '150px', maxHeight: '150px', objectFit: 'contain' }} />
                    ) : <span style={{ fontSize: '80px' }}>🔋</span>}
                  </div>
                  
                  <h3 style={{
                    fontSize: '22px', fontWeight: '800', margin: '0 0 5px',
                    color: RARITY_CONFIG[selectedCard.rarity].glow
                  }}>{selectedCard.name}</h3>
                  
                  <div style={{ fontSize: '36px', fontWeight: '900', color: '#fff', opacity: 0.3 }}>
                    {selectedCard.year}
                  </div>
                </div>
                
                <p style={{ fontSize: '14px', color: '#ccc', lineHeight: '1.6', textAlign: 'center', marginBottom: '20px' }}>
                  {selectedCard.description}
                </p>
                
                <div style={{
                  background: 'rgba(255,255,255,0.05)', borderRadius: '12px',
                  padding: '15px', marginBottom: '20px'
                }}>
                  <div style={{ fontSize: '11px', color: '#888', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '6px' }}>
                    💡 Цікавий факт
                  </div>
                  <div style={{ fontSize: '13px', color: '#aaa', lineHeight: '1.5' }}>
                    {selectedCard.funFact}
                  </div>
                </div>
                
                <button onClick={() => setShowModal(false)} style={{
                  width: '100%', padding: '14px', borderRadius: '12px', border: 'none',
                  background: RARITY_CONFIG[selectedCard.rarity].gradient,
                  color: '#fff', fontSize: '16px', fontWeight: '700', cursor: 'pointer',
                  boxShadow: `0 8px 25px ${RARITY_CONFIG[selectedCard.rarity].glow}40`
                }}>
                  OK
                </button>
              </div>
            </div>
          )}

          {/* Футер */}
          <footer style={{
            textAlign: 'center', padding: '40px 20px',
            borderTop: '1px solid rgba(255,255,255,0.1)', color: '#666'
          }}>
            <div style={{ fontSize: '14px', marginBottom: '10px' }}>🔋 Power Collection • Est. 2025</div>
            <div style={{ fontSize: '12px' }}>Колекція поповнюється щороку 7 січня</div>
          </footer>

          {/* PIN модалка */}
          {showPinModal && (
            <div onClick={() => setShowPinModal(false)} style={{
              position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.9)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              zIndex: 1000, animation: 'fadeIn 0.3s ease', padding: '20px'
            }}>
              <div onClick={e => e.stopPropagation()} style={{
                background: 'linear-gradient(145deg, #1a1a3a, #0a0a1a)',
                borderRadius: '30px', padding: '40px', maxWidth: '400px', width: '100%',
                border: '2px solid #FFD700',
                boxShadow: '0 0 60px rgba(255,215,0,0.3)',
                animation: 'modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)'
              }}>
                <div style={{ textAlign: 'center', marginBottom: '30px' }}>
                  <div style={{ fontSize: '60px', marginBottom: '20px' }}>🔐</div>
                  <h3 style={{ fontSize: '24px', fontWeight: '700', color: '#fff', marginBottom: '10px' }}>
                    Секретний код
                  </h3>
                  <p style={{ fontSize: '14px', color: '#888' }}>
                    Введи код, щоб відкрити подарунок
                  </p>
                </div>
                
                <input
                  type="password"
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  onKeyPress={(e) => e.key === 'Enter' && handlePinSubmit()}
                  placeholder="••••"
                  maxLength={10}
                  style={{
                    width: '100%', padding: '20px', fontSize: '24px', textAlign: 'center',
                    borderRadius: '15px', border: pinError ? '2px solid #FF4444' : '2px solid #333',
                    background: '#111', color: '#fff', marginBottom: '10px',
                    letterSpacing: '10px', outline: 'none'
                  }}
                  autoFocus
                />
                
                {pinError && (
                  <div style={{ color: '#FF4444', fontSize: '14px', textAlign: 'center', marginBottom: '15px' }}>
                    Невірний код! Спробуй ще раз 😅
                  </div>
                )}
                
                <button
                  onClick={handlePinSubmit}
                  style={{
                    width: '100%', padding: '15px', borderRadius: '15px', border: 'none',
                    background: 'linear-gradient(135deg, #FFD700, #FF6F00)',
                    color: '#fff', fontSize: '16px', fontWeight: '700', cursor: 'pointer',
                    marginTop: '10px'
                  }}
                >
                  Відкрити 🎁
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
